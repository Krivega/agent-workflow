name: Validate agent-workflow
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
      - name: Install libarchive tools for package closure checks
        run: sudo apt-get update -qq && sudo apt-get install -y libarchive-tools
      - name: Prepare pinned SDK test binary
        run: |
          archive="$RUNNER_TEMP/temporal_cli_1.9.1_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz" --output "$archive"
          yarn prepare:temporal-cli "$archive"
      - name: Validate including the local SDK server
        env:
          ADR_BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: yarn validate

  native-consumer-boundary:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
      - name: Test the native macOS consumer boundary
        run: yarn test:installed-full-consumers:unit
