name: Validate agent-workflow
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
      - name: Prepare pinned SDK test binary
        run: |
          case "$(uname -m)" in
            arm64) arch=arm64 ;;
            x86_64) arch=amd64 ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/temporal_cli_1.9.1_darwin_$arch.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/temporalio/cli/releases/download/v1.9.1/$(basename "$archive")" --output "$archive"
          yarn prepare:temporal-cli "$archive"
      - name: Validate including the local SDK server
        env:
          ADR_BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: yarn validate
