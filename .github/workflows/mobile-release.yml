name: Release mobile catalog
on:
  push:
    tags: ['mobile-v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and test the release image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/krivega/agent-workflow-mobile:$TAG"
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image" -f examples/mobile-control/tnas/Dockerfile examples/mobile-control
          sh examples/mobile-control/tnas/test-host.sh
          sh examples/mobile-control/tnas/smoke.sh "$image"
          sh examples/mobile-control/tnas/test-ingress.sh "$image"
      - name: Publish verified image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/krivega/agent-workflow-mobile:$TAG"
          docker push "$image"
          docker image inspect --format '{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
